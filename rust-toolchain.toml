[toolchain]
# Tracks stable. This file used to pin an exact version so a Rust release
# could not turn CI red with no source change (1.99 deprecating
# `Atomic::fetch_update` did exactly that); the pin was removed deliberately.
# If a new stable breaks `clippy -D warnings`, fix the lint fallout — do not
# silently reintroduce a pin without saying so.
channel = "stable"
components = ["rustfmt", "clippy"]
