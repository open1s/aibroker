# LLM Broker — example configuration
#
#   cp config.example.toml config.toml
#   cargo run -- --config config.toml --check
#
# NEVER commit a config file that contains a literal secret. Local configs are
# gitignored for that reason; prefer `env:NAME` references so the repository
# only ever holds a variable name.
#
# Every section below is optional except `[[providers]]`. Existing 1.x configs
# keep working: the only fields that were ever required are `server.host`,
# `server.port` and one provider with one key.

proxy_type = "pingora"

[server]
host = "0.0.0.0"
port = 11436
threads = 4
daemon = false
# Upstream connect timeout; 0 uses the pingora default.
connect_timeout_ms = 5_000
# Upstream keep-alive; falls back to load_balancing.idle_timeout_secs.
idle_timeout_ms = 120_000
# Per-attempt read timeout. Unset keeps pingora's 60s default, which is short
# for LLM traffic: a long completion, or a reasoning model that thinks before
# it writes, can exceed a minute. When this fires the attempt counts as a
# transport failure and rotates to another key, so a small value turns normal
# slow answers into an exhausted key pool. Set generously for LLM work.
read_timeout_ms = 600_000
# Total attempts per client request, including the first one. This is also the
# budget for rotating onto another key after a 429/5xx.
max_retries = 3
# How long a graceful stop (SIGTERM, docker stop) waits for in-flight requests.
# Ctrl+C exits immediately; any repeated signal exits unconditionally. pingora
# defaults this to 300s and ignores further signals while it waits, which reads
# as a hang, so the default here is much shorter.
graceful_shutdown_secs = 30

# ---------------------------------------------------------------------------
# Providers and their key pools
# ---------------------------------------------------------------------------

[[providers]]
name = "openai"
base_url = "https://api.openai.com"
# auth = "bearer"          # bearer | x-api-key | api-key | query | <header name>
# auth_query_param = "key" # used when auth = "query"
# path_prefix = "/v1"      # prepended to every upstream path
# Provider-wide fallbacks, applied to keys that do not set their own.
max_rpm = 500
max_tpm = 2_000_000
max_concurrency = 64
default_models = ["gpt-4o", "gpt-4o-mini"]

[[providers.api_keys]]
id = "openai-1"
# `env:NAME` reads the secret from the environment instead of the file.
key = "env:OPENAI_API_KEY_1"
weight = 2
max_rpm = 500

[[providers.api_keys]]
id = "openai-2"
key = "env:OPENAI_API_KEY_2"
weight = 1
max_rpm = 500
# Keep a key in the pool but out of rotation.
# enabled = false

[[providers]]
name = "anthropic"
base_url = "https://api.anthropic.com"
# Anthropic expects `x-api-key`; this is the default for the provider.
auth = "x-api-key"
default_models = ["claude-3-5-sonnet-latest"]

[[providers.api_keys]]
id = "anthropic-1"
key = "env:ANTHROPIC_API_KEY"

[[providers]]
name = "nvidia"
base_url = "https://integrate.api.nvidia.com"
default_models = ["minimaxai/minimax-m2.5"]

[[providers.api_keys]]
id = "nvidia-1"
key = "env:NVIDIA_API_KEY_1"
weight = 2
max_rpm = 40

[[providers.api_keys]]
id = "nvidia-2"
key = "env:NVIDIA_API_KEY_2"
weight = 2
max_rpm = 40

# ---------------------------------------------------------------------------
# Model routing
# ---------------------------------------------------------------------------
# Later, more specific rules win. `providers` is an ordered failover list: the
# broker moves to the next provider when the previous pool is exhausted.

[[routes]]
model = "claude-*"
providers = ["anthropic", "openai"]

[[routes]]
model = "gpt-*"
providers = ["openai"]

[[routes]]
model = "minimax*"
providers = ["nvidia"]

# Catch-all. Omit it to refuse models that no rule and no provider claims.
[[routes]]
model = "*"
providers = ["openai", "anthropic", "nvidia"]

# ---------------------------------------------------------------------------
# Load balancing
# ---------------------------------------------------------------------------

[load_balancing]
# round_robin | weighted_random | least_busy | least_latency | usage_based |
# power_of_two | fallback
strategy = "usage_based"
# Tried in order when the primary strategy cannot place a request.
fallback_strategies = ["least_busy", "round_robin"]
# How much a lighter key may still win a weighted roll (0.0 = strict weights).
weighted_random_tolerance = 0.1

# Cooldown ramp after a failure: initial * multiplier^level, capped, with
# +/- jitter to avoid a thundering herd. The default is 1min -> 5min -> 25min.
initial_cooldown_secs = 60
cooldown_multiplier = 5.0
max_cooldown_secs = 1_500
cooldown_jitter = 0.2

# When every key is exhausted, wait this long for the earliest key to recover
# before answering 429. 0 fails fast.
max_wait_for_key_secs = 15
idle_timeout_secs = 120

# ---------------------------------------------------------------------------
# Key health (circuit breaker)
# ---------------------------------------------------------------------------

[health]
enabled = true
# EWMA weight for latency observations.
latency_alpha = 0.2
# Score below this opens the circuit for the key.
unhealthy_threshold = 0.3
# Consecutive failures that open the circuit immediately.
failure_threshold = 3

# Health is reliability only: it falls by a fifth per consecutive failure and
# rises on success, so a key that answers every request reads 100% however slow
# it is. Latency is measured separately (`latency_ms` on the dashboard) and is
# what the `least_latency` strategy ranks on. This matters for an LLM proxy,
# where a healthy answer routinely takes tens of seconds: scoring health by
# latency reported working keys as nearly dead.

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------

[observability]
metrics_enabled = true
metrics_path = "/metrics"
# One structured log line per completed request.
access_log = false
# Read `usage` out of responses to account TPM and cost.
usage_tracking = true
usage_scan_limit_bytes = 65_536

# Optional, for cost estimates in /metrics.
# [[observability.model_pricing]]
# model = "gpt-4o"
# input_per_million = 2.5
# output_per_million = 10.0

# ---------------------------------------------------------------------------
# API dialects
# ---------------------------------------------------------------------------
# Both OpenAI dialects are proxied and both are forwarded untouched:
#
#   POST /v1/chat/completions   {"model":"gpt-4o","messages":[...]}
#   POST /v1/responses          {"model":"gpt-4o","input":"...","max_output_tokens":64}
#
# The output-token cap and the `usage` field names are read per dialect, so
# token accounting and TPM reservation work for either.
#
# The model must be declared *before* the body streams, because pingora picks
# the upstream peer first. In precedence order:
#
#   1. the `x-llm-model` header (any dialect; what an SDK should set)
#   2. a `?model=` query parameter, e.g. POST /v1/responses?model=gpt-4o
#   3. the path, for providers that put the model there
#      (/v1/models/<model>:generateContent)
#
# Without one of those the request is still proxied -- the body's own `model`
# field is what the provider reads -- but the broker may choose a key that does
# not declare that model, and per-model counters and policy see no model. This
# is the same for both dialects; neither has ever had a body-derived model
# before routing.

# ---------------------------------------------------------------------------
# Admin API
# ---------------------------------------------------------------------------
# The control plane can add, disable and delete credentials, so it refuses
# every request when no token is configured unless `allow_insecure` is set.

[admin]
enabled = true
mode = "path"              # separate | path | off
host = "127.0.0.1"
port = 11437               # used when mode = "separate"
path = "/admin"            # used when mode = "path"
token = "env:LLM_BROKER_ADMIN_TOKEN"
# Write key changes back to this file.
persist = true
# allow_insecure = true    # only for a loopback-only, trusted machine

# ---------------------------------------------------------------------------
# Client access control
# ---------------------------------------------------------------------------
# Who may use the proxy. Without any [[clients]] the proxy is open: anything
# that can reach the port can spend your keys. Define clients to require a
# token and to scope what each one may send.
#
# The token identifies the caller. It is compared in constant time and is never
# logged, never echoed in a refusal, and never returned by the admin API.
# `file:` keeps it out of the environment, which is visible to `ps` and to
# child processes; Kubernetes and Docker secrets mount naturally this way.

# [[clients]]
# name = "laptop"
# token = "env:LLM_BROKER_CLIENT_TOKEN"
# # token = "file:/run/secrets/laptop-token"
# enabled = true
#
# # Egress scope. Empty means "any". Patterns accept * and ?.
# allowed_models = ["gpt-4o", "gpt-4o-mini", "claude-3-5-*"]
# allowed_providers = ["openai"]
#
# # Optional per-client budgets, independent of the key pools.
# max_rpm = 120
# max_tpm = 200000
# max_concurrency = 4
#
# # A second client with a narrower scope.
# [[clients]]
# name = "batch-job"
# token = "file:/run/secrets/batch-token"
# allowed_models = ["gpt-4o-mini"]
# max_rpm = 30

# ---------------------------------------------------------------------------
# Egress policy (Rego)
# ---------------------------------------------------------------------------
# Every request that is about to leave the machine is decided by a Rego policy,
# so "may this client send this model to this provider" is reviewable by
# someone who does not write Rust. Both `glob.match` and `regex.match` are
# available. With no policy configured the built-in default applies, which is:
# an open proxy stays open; an authenticated client is held to its allow-lists
# and its budget.
#
# A policy failure refuses the request rather than forwarding it.

[policy]
enabled = true
# files = ["policy.rego"]     # loaded in order; see policy.example.rego
# inline = """
# package llm.authz
# import rego.v1
# default allow := false
# allow if input.request.estimated_tokens <= 4000
# reason := "prompts over 4000 tokens are not permitted" if input.request.estimated_tokens > 4000
# """

# ---------------------------------------------------------------------------
# Shadow (dry-run) policy
# ---------------------------------------------------------------------------
# A candidate policy evaluated against live traffic but never enforced. Use it
# to find out what a policy would do before letting it block anything: write the
# new rules here, watch llm_broker_shadow_policy_blocks_total and the
# "shadow policy would have refused" log lines, then move them into `inline` or
# `files` once the numbers look right.
#
# dry_run = "candidate.rego"
# dry_run_inline = """
# package llm.authz
# import rego.v1
# default allow := false
# allow if input.request.estimated_tokens <= 4000
# reason := "prompts over 4000 tokens would be refused" if input.request.estimated_tokens > 4000
# """
