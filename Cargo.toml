[package]
name = "aibroker"
version = "2.0.0"
edition = "2024"
description = "Local LLM proxy with load balancing, retry-on-rate-limit and key management"

[dependencies]
# Pingora - async HTTP proxy framework (server, TLS and upstream pools)
pingora = { version = "0.8.0", features = ["proxy", "rustls"] }
pingora-proxy = "0.8.0"
pingora-core = "0.8.0"
pingora-error = "0.8.0"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
http = "1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
parking_lot = "0.12"
url = "2"
bytes = "1"
dirs = "6.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
# The integration tests run a mock upstream on a real pingora listener.
pingora = { version = "0.8.0", features = ["proxy"] }
async-trait = "0.1"
bytes = "1"
