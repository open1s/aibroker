name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            use-cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use-cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use-cross: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in step with rust-toolchain.toml and .github/workflows/ci.yml.
          toolchain: 1.99.0

      # `rust-toolchain.toml` pins the channel and takes precedence over the
      # action's `targets:` input, so the cross target has to be added
      # explicitly. Without this, building x86_64-apple-darwin on an arm64
      # runner fails with "can't find crate for `core`".
      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -C target/${{ matrix.target }}/release -czvf aibroker-${{ matrix.target }}.tar.gz aibroker

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: 7z a aibroker-${{ matrix.target }}.zip ./target/${{ matrix.target }}/release/aibroker.exe

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aibroker-*.tar.gz
            aibroker-*.zip
